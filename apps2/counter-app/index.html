<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <main class="container">

        <div class="root d-flex flex-column justify-content-center align-items-center">

            <!-- Title -->

            <div class="text-center mb-4">
                <h1 class="display-2">Counter</h1>
            </div>

            <!-- Counter Display -->

            <div class="border border-black rounded-pill px-5 py-3 mb-4">
                <span id="counter" class="display-2">0</span>
            </div>

            <!-- Buttons -->

            <div class="text-center">

                <button id="btnDiv" class="btn btn-lg btn-outline-primary me-2 mb-2">
                    Divide
                </button>

                <button id="btnDecr" class="btn btn-lg btn-outline-primary me-2 mb-2">
                    Decrease
                </button>

                <button id="btnReset" class="btn btn-lg btn-outline-secondary me-2 mb-2">
                    Reset
                </button>

                <button id="btnIncr" class="btn btn-lg btn-outline-success me-2 mb-2">
                    Increase
                </button>

                <button id="btnMul" class="btn btn-lg btn-outline-dark me-2 mb-2">
                    Multiply
                </button>

            </div>

        </div>

    </main>

    <script src="main.js"></script>

</body>

</html>
